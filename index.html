<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cramly</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cramly">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <button id="themeToggle">🌙 Dark Mode</button>
      <h1>🎓Cramly</h1>
      <p class="tagline">Your friendly AI study buddy. Let's turn messy notes into an easy win.</p>
    </header>

    <textarea id="notesInput" rows="8" placeholder="Paste your messy notes here..."></textarea>
    <br><br>

    <label for="imageInput">📷 Or attach a photo of your notes (optional):</label><br>
    <input type="file" id="imageInput" accept="image/*">
    <br><br>

    <select id="difficulty">
      <option value="easy">Easy (Quick Review)</option>
      <option value="medium" selected>Medium (Standard)</option>
      <option value="hard">Hard (Exam-Level, Written Answers)</option>
    </select>
    <br><br>

    <button id="generateBtn">Start Studying</button>

    <div id="output"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
